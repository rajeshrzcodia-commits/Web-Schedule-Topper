# -----------------------------------------------------------------------------
# Backend Monitoring System — docker-compose.yml
# Services: backend (Node.js) + mongodb (data durable via named volume)
# -----------------------------------------------------------------------------
version: '3'
services:
  backend:
    build: .
    container_name: backend-monitor
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/monitoring_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - monitor-net

  mongodb:
    image: mongo:7
    container_name: mongodb-monitor
    restart: unless-stopped
    ports:
      - "27017:27017"
    # Named volume ensures data durability across container restarts.
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitor-net

volumes:
  mongodb_data:
    driver: local

networks:
  monitor-net:
    driver: bridge
